# Render Blueprint: creates the API and admin website from this repository.
# Values marked sync: false are entered in the Render dashboard, never stored here.
services:
  - type: web
    name: du-student-api
    runtime: node
    rootDir: du_student_api
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:hosted
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: du-admin-web
    runtime: node
    rootDir: du_admin_web
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
